<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Grocery Hub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --card-border: #26324a;
    --cyan: #00d9ff;
    --orange: #ff6b35;
    --gold: #ffd60a;
    --mint: #06d6a0;
    --text: #ffffff;
    --muted: #8892b0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding-bottom: 90px;
  }

  .topbar {
    background: linear-gradient(135deg, #4c4ce0 0%, #6b3fd4 100%);
    padding: 20px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }

  .topbar .status-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--muted);
  }

  .topbar .status-dot.connected {
    background: var(--mint);
    box-shadow: 0 0 8px var(--mint);
  }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- Dashboard ---------- */
  .hero { padding: 24px 20px 8px; }
  .hero-title { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .hero-title .accent { color: var(--cyan); }
  .hero-sub {
    color: var(--muted); font-size: 13px; margin-top: 6px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }

  .stats-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px;
  }

  .stat-box {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 16px 10px; text-align: center;
  }

  .stat-box .num { font-size: 26px; font-weight: 900; color: var(--cyan); }
  .stat-box .label {
    font-size: 10px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 4px;
  }

  .section-title {
    padding: 8px 20px; font-size: 12px; font-weight: 800; color: var(--muted);
    text-transform: uppercase; letter-spacing: 1px;
  }

  .cards { display: flex; flex-direction: column; gap: 10px; padding: 0 20px 20px; }

  .item-card {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }

  .item-left .name { font-size: 15px; font-weight: 700; }
  .item-left .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .week-badge {
    display: inline-block; background: rgba(0,217,255,0.12); color: var(--cyan);
    font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px; margin-right: 6px;
  }

  .priority-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px; }
  .priority-High { background: rgba(255,107,53,0.15); color: var(--orange); }
  .priority-Medium { background: rgba(255,214,10,0.15); color: var(--gold); }
  .priority-Low { background: rgba(6,214,160,0.15); color: var(--mint); }

  .empty, .loading, .error { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }
  .error { color: var(--orange); }

  .refresh-btn {
    margin: 0 20px 20px; width: calc(100% - 40px); background: var(--cyan);
    color: #0f1419; border: none; padding: 14px; border-radius: 12px;
    font-weight: 800; font-size: 13px; text-transform: uppercase;
    letter-spacing: 0.5px; cursor: pointer;
  }

  .refresh-btn:active { opacity: 0.8; }

  /* ---------- Add Items screen ---------- */
  .add-header { padding: 20px; }
  .add-header h2 { font-size: 22px; font-weight: 900; }
  .add-header p { color: var(--muted); font-size: 12px; margin-top: 4px; }

  .category-chips {
    display: flex; gap: 8px; padding: 0 20px 16px; overflow-x: auto;
  }

  .chip {
    flex: 0 0 auto;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--muted); padding: 8px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }

  .chip.active {
    background: var(--cyan); color: #0f1419; border-color: var(--cyan);
  }

  .template-list { padding: 0 20px; display: flex; flex-direction: column; gap: 8px; }

  .template-row {
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 12px; padding: 12px 14px;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }

  .template-row.added {
    border-color: var(--mint);
    background: rgba(6,214,160,0.08);
  }

  .template-row .t-name { font-size: 14px; font-weight: 700; }
  .template-row .t-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .add-btn-small {
    background: rgba(0,217,255,0.12); color: var(--cyan);
    border: none; width: 32px; height: 32px; border-radius: 50%;
    font-size: 18px; font-weight: 900; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .template-row.added .add-btn-small {
    background: var(--mint); color: #0f1419;
  }

  /* ---------- Bottom Nav ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #141b28; border-top: 1px solid var(--card-border);
    display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    z-index: 20;
  }

  .nav-btn {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 8px 4px; font-size: 11px; font-weight: 700;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer;
  }

  .nav-btn .icon { font-size: 20px; }
  .nav-btn.active { color: var(--cyan); }

  /* ---------- Quantity modal ---------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 30; align-items: flex-end; justify-content: center;
  }

  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--card); border-radius: 20px 20px 0 0;
    padding: 24px 20px max(24px, env(safe-area-inset-bottom));
    width: 100%; max-width: 480px;
  }

  .modal-box h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .modal-box .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }

  .modal-box label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: var(--muted); margin-bottom: 6px; display: block;
  }

  .modal-box input, .modal-box select {
    width: 100%; background: #0f1419; border: 1px solid var(--card-border);
    color: var(--text); padding: 12px; border-radius: 10px; font-size: 14px;
    margin-bottom: 14px;
  }

  .modal-actions { display: flex; gap: 10px; }

  .modal-btn {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-weight: 800; font-size: 13px; text-transform: uppercase; cursor: pointer;
  }

  .modal-btn.cancel { background: #26324a; color: var(--text); }
  .modal-btn.confirm { background: var(--cyan); color: #0f1419; }

  .toast {
    position: fixed; top: 90px; left: 50%; transform: translateX(-50%);
    background: var(--mint); color: #0f1419; padding: 10px 20px;
    border-radius: 10px; font-size: 13px; font-weight: 800;
    z-index: 40; display: none;
  }

  .toast.show { display: block; }
</style>
</head>
<body>

  <div class="topbar">
    <h1>🛒 Grocery Hub</h1>
    <div class="status-dot" id="statusDot"></div>
  </div>

  <div class="toast" id="toast">Added!</div>

  <!-- DASHBOARD SCREEN -->
  <div class="screen active" id="screen-dashboard">
    <div class="hero">
      <div class="hero-title">WEEK <span class="accent" id="weekNum">—</span></div>
      <div class="hero-sub" id="lastUpdated">Connecting...</div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="num" id="totalItems">—</div>
        <div class="label">Items</div>
      </div>
      <div class="stat-box">
        <div class="num" id="highCount">—</div>
        <div class="label">High Priority</div>
      </div>
      <div class="stat-box">
        <div class="num" id="catCount">—</div>
        <div class="label">Categories</div>
      </div>
    </div>

    <div class="section-title">Your Grocery List</div>
    <div class="cards" id="itemsContainer">
      <div class="loading">Loading your list...</div>
    </div>

    <button class="refresh-btn" onclick="loadItems()">↻ Refresh</button>
  </div>

  <!-- ADD ITEMS SCREEN -->
  <div class="screen" id="screen-add">
    <div class="add-header">
      <h2>Quick Add</h2>
      <p>Tap a category, then tap items to add them to Week <span id="addWeekLabel">1</span></p>
    </div>

    <div class="category-chips" id="categoryChips"></div>

    <div class="template-list" id="templateList">
      <div class="loading">Loading items...</div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="showScreen('dashboard')">
      <span class="icon">📊</span> Dashboard
    </button>
    <button class="nav-btn" id="nav-add" onclick="showScreen('add')">
      <span class="icon">➕</span> Add Items
    </button>
  </div>

  <!-- QUANTITY MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalItemName">Item</h3>
      <div class="sub" id="modalItemCategory">Category</div>

      <label>Quantity</label>
      <input type="text" id="modalQty" placeholder="e.g., 2 lbs">

      <label>Priority</label>
      <select id="modalPriority">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>

      <div class="modal-actions">
        <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
        <button class="modal-btn confirm" onclick="confirmAdd()">Add to List</button>
      </div>
    </div>
  </div>

<script>
  var API_URL = "https://script.google.com/macros/s/AKfycbytVlPk_mRoGplYQhABHgTJ-FFYqE1hBWOJMzOQTVzz2PwLHbPxvoeKm6bc4y78X8qx/exec";

  var currentItems = [];
  var currentTemplates = [];
  var activeCategory = 'All';
  var pendingTemplate = null;
  var currentWeek = 1;

  // ---------- Navigation ----------
  function showScreen(name) {
    document.getElementById('screen-dashboard').classList.remove('active');
    document.getElementById('screen-add').classList.remove('active');
    document.getElementById('nav-dashboard').classList.remove('active');
    document.getElementById('nav-add').classList.remove('active');

    document.getElementById('screen-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');

    if (name === 'add' && currentTemplates.length === 0) {
      loadTemplates();
    }
  }

  // ---------- Dashboard ----------
  function loadItems() {
    document.getElementById('itemsContainer').innerHTML = '<div class="loading">Loading your list...</div>';
    document.getElementById('lastUpdated').textContent = 'Connecting...';
    document.getElementById('statusDot').classList.remove('connected');

    fetch(API_URL + '?action=getItems')
      .then(function(res) { return res.json(); })
      .then(function(items) {
        if (items.error) { throw new Error(items.error); }
        currentItems = items;
        if (items.length > 0) {
          var weeks = items.map(function(i) { return parseInt(i.week) || 1; });
          currentWeek = Math.max.apply(null, weeks);
        }
        document.getElementById('addWeekLabel').textContent = currentWeek;
        renderItems(items);
        document.getElementById('statusDot').classList.add('connected');
        var now = new Date();
        document.getElementById('lastUpdated').textContent =
          'Synced ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      })
      .catch(function(err) {
        document.getElementById('itemsContainer').innerHTML =
          '<div class="error">Could not load data.<br>' + err.message + '</div>';
        document.getElementById('lastUpdated').textContent = 'Connection failed';
      });
  }

  function renderItems(items) {
    var container = document.getElementById('itemsContainer');

    if (!items || items.length === 0) {
      container.innerHTML = '<div class="empty">No items yet. Tap "Add Items" below.</div>';
      document.getElementById('totalItems').textContent = '0';
      document.getElementById('highCount').textContent = '0';
      document.getElementById('catCount').textContent = '0';
      document.getElementById('weekNum').textContent = '-';
      return;
    }

    document.getElementById('weekNum').textContent = currentWeek;

    var sorted = items.slice().sort(function(a, b) {
      var order = { High: 0, Medium: 1, Low: 2 };
      return order[a.priority] - order[b.priority];
    });

    var html = '';
    sorted.forEach(function(item) {
      html += '<div class="item-card">';
      html += '  <div class="item-left">';
      html += '    <div class="name">' + item.name + '</div>';
      html += '    <div class="meta"><span class="week-badge">W' + item.week + '</span>' + (item.category || '') + ' - ' + (item.quantity || '-') + '</div>';
      html += '  </div>';
      html += '  <div class="priority-badge priority-' + item.priority + '">' + item.priority + '</div>';
      html += '</div>';
    });
    container.innerHTML = html;

    document.getElementById('totalItems').textContent = items.length;
    document.getElementById('highCount').textContent = items.filter(function(i) { return i.priority === 'High'; }).length;
    document.getElementById('catCount').textContent = new Set(items.map(function(i) { return i.category; })).size;
  }

  // ---------- Add Items ----------
  function loadTemplates() {
    document.getElementById('templateList').innerHTML = '<div class="loading">Loading items...</div>';

    fetch(API_URL + '?action=getTemplates')
      .then(function(res) { return res.json(); })
      .then(function(templates) {
        if (templates.error) { throw new Error(templates.error); }
        currentTemplates = templates;
        renderCategoryChips();
        renderTemplateList();
      })
      .catch(function(err) {
        document.getElementById('templateList').innerHTML =
          '<div class="error">Could not load items.<br>' + err.message + '</div>';
      });
  }

  function renderCategoryChips() {
    var categories = ['All'];
    currentTemplates.forEach(function(t) {
      if (categories.indexOf(t.category) === -1) categories.push(t.category);
    });

    var html = '';
    categories.forEach(function(cat) {
      var activeClass = (cat === activeCategory) ? 'active' : '';
      html += '<div class="chip ' + activeClass + '" onclick="selectCategory(\'' + cat + '\')">' + cat + '</div>';
    });
    document.getElementById('categoryChips').innerHTML = html;
  }

  function selectCategory(cat) {
    activeCategory = cat;
    renderCategoryChips();
    renderTemplateList();
  }

  function renderTemplateList() {
    var filtered = (activeCategory === 'All')
      ? currentTemplates
      : currentTemplates.filter(function(t) { return t.category === activeCategory; });

    var addedNames = currentItems
      .filter(function(i) { return parseInt(i.week) === currentWeek; })
      .map(function(i) { return i.name; });

    var html = '';
    filtered.forEach(function(t) {
      var isAdded = addedNames.indexOf(t.name) !== -1;
      html += '<div class="template-row ' + (isAdded ? 'added' : '') + '" onclick="' + (isAdded ? '' : 'openModal(\'' + t.name.replace(/'/g, "\\'") + '\')') + '">';
      html += '  <div>';
      html += '    <div class="t-name">' + t.name + '</div>';
      html += '    <div class="t-meta">' + t.category + ' · usually ' + t.typicalQty + (t.notes ? ' · ' + t.notes : '') + '</div>';
      html += '  </div>';
      html += '  <button class="add-btn-small">' + (isAdded ? '✓' : '+') + '</button>';
      html += '</div>';
    });

    document.getElementById('templateList').innerHTML = html || '<div class="empty">No items in this category.</div>';
  }

  // ---------- Modal ----------
  function openModal(templateName) {
    pendingTemplate = currentTemplates.find(function(t) { return t.name === templateName; });
    if (!pendingTemplate) return;

    document.getElementById('modalItemName').textContent = pendingTemplate.name;
    document.getElementById('modalItemCategory').textContent = pendingTemplate.category + (pendingTemplate.notes ? ' · ' + pendingTemplate.notes : '');
    document.getElementById('modalQty').value = pendingTemplate.typicalQty || '';
    document.getElementById('modalPriority').value = pendingTemplate.typicalPriority || 'Medium';

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    pendingTemplate = null;
  }

  function confirmAdd() {
    if (!pendingTemplate) return;

    var qty = document.getElementById('modalQty').value;
    var priority = document.getElementById('modalPriority').value;

    var payload = {
      action: 'addItem',
      week: currentWeek,
      name: pendingTemplate.name,
      category: pendingTemplate.category,
      quantity: qty,
      priority: priority,
      notes: pendingTemplate.notes || ''
    };

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function(res) { return res.json(); })
      .then(function(result) {
        closeModal();
        showToast('✓ ' + payload.name + ' added');
        loadItems().then ? null : null;
        // refresh items list in background so "added" state updates
        fetch(API_URL + '?action=getItems')
          .then(function(res) { return res.json(); })
          .then(function(items) {
            currentItems = items;
            renderTemplateList();
          });
      })
      .catch(function(err) {
        closeModal();
        alert('Could not add item: ' + err.message);
      });
  }

  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() { toast.classList.remove('show'); }, 2000);
  }

  loadItems();
</script>

</body>
</html>
